name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 3b: Resolve FTP Host IP to bypass DNS EAI_AGAIN errors
      - name: 3b. Resolve Clean Host IP
        id: resolve-ip
        run: |
          CLEAN_HOST=$(python3 -c "import socket, os; raw=os.environ.get('RAW_HOST','').replace('ftp://','').replace('ftps://','').strip('/ '); print(socket.gethostbyname(raw) if raw else '')" 2>/dev/null || echo "")
          if [ -z "$CLEAN_HOST" ]; then
            echo "CLEAN_HOST=${{ secrets.FTP_SERVER }}" >> $GITHUB_OUTPUT
          else
            echo "CLEAN_HOST=$CLEAN_HOST" >> $GITHUB_OUTPUT
          fi
        env:
          RAW_HOST: ${{ secrets.FTP_SERVER }}

      # Step 4: Incremental FTP Sync with IP resolution & retry fallback
      - name: 4. Incremental FTP Deploy to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve-ip.outputs.CLEAN_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state.json
          security: loose
          log-level: verbose
