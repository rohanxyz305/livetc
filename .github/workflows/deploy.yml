name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 3b: Resolve Clean Hostname to prevent DNS EAI_AGAIN errors
      - name: 3b. Resolve Clean Hostname
        id: resolve-ip
        run: |
          CLEAN_HOST=$(python3 -c '
          import os, socket, re
          raw = os.environ.get("RAW_SERVER", "").strip()
          clean = re.sub(r"^(ftp|ftps|http|https)://", "", raw, flags=re.IGNORECASE)
          clean = clean.split("/")[0].split(":")[0].strip()
          if clean.startswith("ftp."):
              try:
                  socket.gethostbyname(clean)
              except Exception:
                  clean = clean[4:]
          print(clean if clean else raw)
          ')
          echo "CLEAN_HOST=$CLEAN_HOST" >> $GITHUB_OUTPUT
          echo "Resolved FTP Server target hostname: $CLEAN_HOST"
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}

      # Step 4: Incremental FTP Sync to public_html with Automatic Retries
      - name: 4. Incremental FTP Deploy to Hosting
        uses: nick-fields/retry@v3
        env:
          NODE_OPTIONS: "--dns-result-order=ipv4first"
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 5
          command: npx @samkirkland/ftp-deploy --server "${{ steps.resolve-ip.outputs.CLEAN_HOST }}" --username "${{ secrets.FTP_USERNAME }}" --password "${{ secrets.FTP_PASSWORD }}" --server-dir "/public_html/" --local-dir "./dist/" --state-name ".ftp-deploy-sync-state.json" --security "loose"
