name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 4: Incremental FTP Sync with Automatic Retry on Network Glitch
      - name: 4. Incremental FTP Deploy to Hosting (with Retries)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 3
          max_attempts: 3
          retry_wait_seconds: 5
          command: npx @samkirkland/ftp-deploy --server "${{ secrets.FTP_SERVER }}" --username "${{ secrets.FTP_USERNAME }}" --password "${{ secrets.FTP_PASSWORD }}" --server-dir "/public_html/" --local-dir "./dist/" --state-name ".ftp-deploy-sync-state.json"
