name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 3b: Bind domain IP directly into /etc/hosts to eliminate DNS EAI_AGAIN errors
      - name: 3b. Bind Target Domain in /etc/hosts
        id: resolve-ip
        run: |
          CLEAN_HOST=$(python3 -c '
          import os, re
          raw = os.environ.get("RAW_SERVER", "").strip()
          clean = re.sub(r"^(ftp|ftps|http|https)://", "", raw, flags=re.IGNORECASE)
          clean = clean.split("/")[0].split(":")[0].strip()
          print(clean if clean else "liveteachcreate.com")
          ')
          echo "CLEAN_HOST=$CLEAN_HOST" >> $GITHUB_OUTPUT
          echo "103.49.131.241 $CLEAN_HOST liveteachcreate.com ftp.liveteachcreate.com" | sudo tee -a /etc/hosts
          echo "Successfully mapped 103.49.131.241 to $CLEAN_HOST in runner /etc/hosts"
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}

      # Step 4: Incremental FTP Sync to public_html
      - name: 4. Incremental FTP Deploy to Hosting
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.resolve-ip.outputs.CLEAN_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
          state-name: .ftp-deploy-sync-state.json
          security: loose
