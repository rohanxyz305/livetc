name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 4: Python-based Zero-Dependency Bulletproof FTP Sync to cPanel
      - name: 4. Deploy Dist to cPanel Hosting
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          python3 -c '
          import os, sys, ftplib, socket, re, time

          raw_server = os.environ.get("FTP_SERVER", "")
          username = os.environ.get("FTP_USERNAME", "")
          password = os.environ.get("FTP_PASSWORD", "")

          if not raw_server or not username or not password:
              print("Error: FTP credentials missing!")
              sys.exit(1)

          # Clean protocol prefixes (http://, ftp://, ftps://), paths, ports, and whitespace
          clean_host = re.sub(r"^(https?://|ftp://|ftps://)", "", raw_server, flags=re.IGNORECASE)
          clean_host = clean_host.split("/")[0].split(":")[0].strip()

          print(f"Target Hostname: {clean_host}")

          # Attempt DNS Resolution
          target_address = clean_host
          try:
              host_ip = socket.gethostbyname(clean_host)
              print(f"Resolved {clean_host} -> {host_ip}")
              target_address = host_ip
          except Exception as e:
              print(f"DNS Resolution warning: {e}. Using raw hostname {clean_host}")

          # Connect with 5 Retry attempts
          ftp = None
          for attempt in range(1, 6):
              try:
                  print(f"Connecting to FTP at {target_address} (Attempt {attempt}/5)...")
                  ftp = ftplib.FTP(target_address, timeout=60)
                  ftp.login(user=username, passwd=password)
                  print("✅ FTP Connected & Authenticated Successfully!")
                  break
              except Exception as err:
                  print(f"Connection attempt {attempt} failed: {err}")
                  if attempt < 5:
                      time.sleep(5)
                  else:
                      print("❌ All FTP Connection Attempts Failed.")
                      sys.exit(1)

          def upload_folder(local_folder, target_dir):
              try:
                  ftp.cwd(target_dir)
              except Exception:
                  ftp.mkd(target_dir)
                  ftp.cwd(target_dir)

              for item in os.listdir(local_folder):
                  lpath = os.path.join(local_folder, item)
                  if os.path.isfile(lpath):
                      ext = os.path.splitext(item)[1].lower()
                      with open(lpath, "rb") as f:
                          if ext in [".html", ".js", ".css", ".txt", ".xml", ".php", ".json", ".svg", ".md"]:
                              ftp.storlines(f"STOR {item}", f)
                          else:
                              ftp.storbinary(f"STOR {item}", f)
                      print(f"Uploaded: {item}")
                  elif os.path.isdir(lpath):
                      upload_folder(lpath, f"{target_dir}/{item}")

          upload_folder("./dist", "/public_html")
          ftp.quit()
          print("🎉 Production Deployment to cPanel Completed Successfully!")
          '
