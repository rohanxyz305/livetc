name: Automated Production Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repository source code
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Setup Node.js 22 environment
      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Step 3: Install dependencies and build production bundle
      - name: 3. Install Dependencies & Build
        run: |
          npm ci
          npm run build

      # Step 3b: Generate server config from GitHub Secrets (never committed to git)
      - name: 3b. Write Hosting & Razorpay Config
        env:
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
          RAZORPAY_NOTIFY_EMAIL: ${{ secrets.RAZORPAY_NOTIFY_EMAIL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
        run: |
          php -r 'file_put_contents("dist/api/hosting-config.php", "<?php" . PHP_EOL . "return " . var_export([
            "rzp_key_id" => getenv("RAZORPAY_KEY_ID"),
            "rzp_key_secret" => getenv("RAZORPAY_KEY_SECRET"),
            "notify_email" => getenv("RAZORPAY_NOTIFY_EMAIL") ?: "connectliveteachcreate@gmail.com",
            "db_host" => getenv("DB_HOST") ?: "localhost",
            "db_name" => getenv("DB_NAME"),
            "db_user" => getenv("DB_USER"),
            "db_pass" => getenv("DB_PASS"),
          ], true) . ";" . PHP_EOL);'

      # Step 4: Robust LFTP Deployment to cPanel hosting
      - name: 4. LFTP Sync to cPanel Hosting
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          lftp -c "
          set ftp:ssl-allow no;
          set ssl:verify-certificate no;
          set net:max-retries 5;
          set net:timeout 30;
          set net:reconnect-interval-base 5;
          open -u '${{ secrets.FTP_USERNAME }}','${{ secrets.FTP_PASSWORD }}' '${{ secrets.FTP_SERVER }}';
          mirror --reverse --delete --verbose ./dist/ /public_html/;
          quit;
          "
